<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CLOUZIE Admin Portal | Reset Password</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"/>
<style>
body { font-family: 'Inter', sans-serif; }
.font-playfair { font-family: 'Playfair Display', serif; }
.btn-brand-black { background-color: #000; }
.btn-brand-black:hover { background-color: #1a1a1a; }
</style>
</head>
<body class="bg-brand-brown min-h-screen flex items-center justify-center p-4">
<main class="w-full max-w-[420px] mx-auto flex flex-col items-center gap-8">
<section class="w-full bg-white rounded-2xl shadow-2xl p-6 sm:p-8 md:p-10">
<div class="text-center mb-8">
<h1 class="font-playfair text-2xl md:text-3xl font-bold tracking-tight text-black mb-2 uppercase">CLOUZIE ADMIN PORTAL</h1>
<p class="text-xs uppercase tracking-[0.22em] text-gray-400">Admin Panel</p>
</div>
<div class="mb-7">
<h2 class="text-xl font-semibold tracking-wide text-black uppercase">Reset Password</h2>
<p class="text-sm text-gray-500 leading-relaxed mt-3">Choose a strong new password for your admin account.</p>
</div>
<form method="POST" class="space-y-6">
{% csrf_token %}
<div class="flex flex-col gap-2">
<label class="text-xs uppercase tracking-wider text-gray-700" for="new_password">New Password</label>
<div class="relative">
<input type="password" name="new_password" id="new_password" required class="w-full px-4 py-3 pr-12 text-base rounded-lg border {% if errors.new_password %}border-red-400 bg-red-50{% else %}border-gray-200{% endif %} focus:ring-1 focus:ring-black focus:border-black outline-none"/>
<button type="button" data-toggle-password="new_password" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-black transition" aria-label="Show password">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
</button>
</div>
{% if errors.new_password %}<p class="text-xs text-red-600">{{ errors.new_password }}</p>{% endif %}
<div class="mt-2">
<div class="h-1 rounded-full bg-gray-100 overflow-hidden"><div id="strengthBar" class="h-full w-0 transition-all duration-300"></div></div>
<p id="strengthText" class="text-[11px] text-gray-400 mt-2">Use 8 or more characters.</p>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="text-xs uppercase tracking-wider text-gray-700" for="confirm_password">Confirm New Password</label>
<div class="relative">
<input type="password" name="confirm_password" id="confirm_password" required class="w-full px-4 py-3 pr-12 text-base rounded-lg border {% if errors.confirm_password %}border-red-400 bg-red-50{% else %}border-gray-200{% endif %} focus:ring-1 focus:ring-black focus:border-black outline-none"/>
<button type="button" data-toggle-password="confirm_password" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-black transition" aria-label="Show password">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
</button>
</div>
{% if errors.confirm_password %}<p class="text-xs text-red-600">{{ errors.confirm_password }}</p>{% endif %}
</div>
<button type="submit" class="btn-brand-black w-full text-white text-sm tracking-widest py-4 rounded-lg transition active:scale-[0.98] uppercase">Reset Password</button>
</form>
</section>
</main>
<script>
document.querySelectorAll('[data-toggle-password]').forEach((button) => {
    button.addEventListener('click', function () {
        const input = document.getElementById(this.dataset.togglePassword);
        const hidden = input.type === 'password';
        input.type = hidden ? 'text' : 'password';
        this.setAttribute('aria-label', hidden ? 'Hide password' : 'Show password');
    });
});
document.getElementById('new_password').addEventListener('input', function () {
    const password = this.value;
    const bar = document.getElementById('strengthBar');
    const text = document.getElementById('strengthText');
    let score = 0;
    if (password.length >= 8) score += 1;
    if (/[a-z]/.test(password) && /[A-Z]/.test(password)) score += 1;
    if (/\d/.test(password) && /[^A-Za-z0-9]/.test(password)) score += 1;
    const states = [
        ['w-0', 'bg-gray-200', 'Use 8 or more characters.', 'text-gray-400'],
        ['w-1/3', 'bg-red-500', 'Weak password', 'text-red-500'],
        ['w-2/3', 'bg-amber-500', 'Medium password', 'text-amber-600'],
        ['w-full', 'bg-green-600', 'Strong password', 'text-green-600']
    ];
    const state = states[password ? score : 0];
    bar.className = 'h-full transition-all duration-300 ' + state[0] + ' ' + state[1];
    text.className = 'text-[11px] mt-2 ' + state[3];
    text.textContent = state[2];
});
</script>
</body>
</html>
