<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CLOUZIE Admin Portal | Forgot Password</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"/>
<style>
body { font-family: 'Inter', sans-serif; }
.font-playfair { font-family: 'Playfair Display', serif; }
.btn-brand-black { background-color: #000; }
.btn-brand-black:hover { background-color: #1a1a1a; }
</style>
</head>
<body class="bg-brand-brown min-h-screen flex items-center justify-center p-4">
<main class="w-full max-w-[420px] mx-auto flex flex-col items-center gap-8">
<section class="w-full bg-white rounded-2xl shadow-2xl p-6 sm:p-8 md:p-10">
<div class="text-center mb-8">
<h1 class="font-playfair text-2xl md:text-3xl font-bold tracking-tight text-black mb-2 uppercase">CLOUZIE ADMIN PORTAL</h1>
<p class="text-xs uppercase tracking-[0.22em] text-gray-400">Admin Panel</p>
</div>
{% if messages %}
{% for message in messages %}
<div class="mb-5 border px-4 py-3 rounded-lg text-xs leading-relaxed {% if 'error' in message.tags %}border-red-200 bg-red-50 text-red-700{% else %}border-gray-200 bg-gray-50 text-gray-700{% endif %}">
{{ message }}
</div>
{% endfor %}
{% endif %}
<div class="mb-7">
<h2 class="text-xl font-semibold tracking-wide text-black uppercase">Forgot Password</h2>
<p class="text-sm text-gray-500 leading-relaxed mt-3">Enter your admin email address and we'll send you an OTP.</p>
</div>
<form method="POST" class="space-y-6">
{% csrf_token %}
<div class="flex flex-col gap-2">
<label class="text-xs uppercase tracking-wider text-gray-700" for="email">Email Address</label>
<input type="email" name="email" id="email" required autofocus class="w-full px-4 py-3 text-base rounded-lg border border-gray-200 focus:ring-1 focus:ring-black focus:border-black outline-none" placeholder="admin@clouzie.com"/>
</div>
<button type="submit" class="btn-brand-black w-full text-white text-sm tracking-widest py-4 rounded-lg transition active:scale-[0.98] uppercase">Send OTP</button>
</form>
<div class="text-center mt-7">
<a href="{% url 'adminpanel:admin-login' %}" class="text-xs text-gray-500 hover:text-black transition">&larr; Back to Login</a>
</div>
</section>
<footer class="text-center"><p class="text-gray-400 text-xs tracking-wide">&copy; 2026 CLOUZIE. All rights reserved.</p></footer>
</main>
</body>
</html>
